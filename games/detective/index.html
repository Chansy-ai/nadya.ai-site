<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Кто украл заявки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600;700&family=Neucha&display=swap">
<style>
:root{
  --bg:#f3ede2;
  --card:#fffdf8;
  --line:#ddd3c2;
  --ink:#1f2a25;
  --soft:#6b6a62;
  --green:#123a2c;
  --green-2:#1d5a44;
  --wine:#8f2442;
  --wine-soft:#f6e3e8;
  --gold:#d8ad5b;
  --gold-soft:#fbf1dc;
  --ok:#2f7a52;
  --ok-soft:#e3f2e9;
  --display:"Unbounded","Arial Black",Arial,sans-serif;
  --body:"Golos Text","Segoe UI",Roboto,Arial,sans-serif;
  --hand:"Neucha","Comic Sans MS","Segoe Print",cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  background:radial-gradient(rgba(18,58,44,.07) 1.2px,transparent 1.3px) 0 0/20px 20px,var(--bg);
  padding:0 0 40px}
.top{background:var(--green);color:#f3ede2;padding:12px 16px;position:sticky;top:0;z-index:5}
.top-in{max-width:560px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}
.top b{font-weight:600}
.case{font:500 12px var(--display);color:var(--green);background:var(--gold);padding:6px 10px;border-radius:999px;white-space:nowrap}
.case.bump{animation:bump .5s ease}
@keyframes bump{40%{transform:scale(1.15)}}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 0}
.panel{display:flex;flex-direction:column;gap:16px;animation:in .3s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.caption{align-self:flex-start;font:500 11px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--wine);background:var(--wine-soft);padding:6px 10px;border-radius:999px}
h1,h2{font-family:var(--display);font-weight:500;margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:clamp(28px,7.5vw,38px)}
h1 em{font-style:normal;color:var(--wine)}
h2{font-size:clamp(19px,5vw,22px)}
p{margin:0}
.lead{font-size:17px}
.muted{color:var(--soft);font-size:14.5px}

.say{display:flex;gap:10px;align-items:flex-start}
.say.right{flex-direction:row-reverse}
.face{flex:none;width:48px;height:48px;border-radius:50%;border:2px solid var(--ink);background:#fff;display:grid;place-items:center;overflow:hidden}
.face img{width:100%;height:100%;object-fit:cover;object-position:center 20%}
.face svg{width:32px;height:32px}
.bubble{background:#fff;border:1.5px solid var(--line);border-radius:4px 16px 16px 16px;padding:9px 13px;font:16px/1.45 var(--body);box-shadow:0 2px 0 var(--line)}
.say.right .bubble{border-radius:16px 4px 16px 16px;background:var(--gold-soft)}
.story{background:var(--green);color:#f3ede2;border-radius:16px;padding:14px 16px;font-size:16px}
.story b{color:var(--gold)}
.ava.flower{background:#f6e3e8;display:grid;place-items:center;font-size:30px}
.fb ul{margin:6px 0 0;padding-left:18px}
#askbox{scroll-margin-top:70px}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;color:#e9efe9;font-size:15px}
.steps b{color:var(--gold)}
.cta .btn.line.light{color:#f3ede2;border-color:#9fb8ac;font-weight:500;background:rgba(255,255,255,.06);word-break:break-all}
.bubble small{display:block;font:600 11px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--wine);margin-bottom:1px}

/* buttons */
.choices{display:flex;flex-direction:column;gap:10px}
.ch{appearance:none;cursor:pointer;text-align:left;font:500 16px/1.35 var(--body);color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;box-shadow:0 3px 0 var(--line);transition:transform .1s,border-color .15s}
.ch:hover{border-color:var(--wine)}
.ch:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.ch.primary{background:var(--wine);border-color:var(--wine);color:#fff;box-shadow:0 3px 0 #5e1229;text-align:center;font-weight:600}
.ch.ghost{background:transparent;box-shadow:none;text-align:center;color:var(--soft)}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* map */
.map{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.loc{appearance:none;cursor:pointer;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;gap:6px;font:500 15px/1.3 var(--body);color:var(--ink);min-height:118px;position:relative}
.loc:hover{border-color:var(--wine)}
.loc .ic{font-size:28px;line-height:1}
.loc small{color:var(--soft);font-size:13px;font-weight:400}
.loc.done{background:var(--ok-soft);border-color:#b8dcc6}
.loc.done::after{content:"✓ улика";position:absolute;top:10px;right:10px;font:600 11px var(--body);color:var(--ok);background:#fff;border-radius:999px;padding:3px 8px}
.progress{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--soft)}
.dots{display:flex;gap:6px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:transparent}
.dots i.on{background:var(--gold)}

/* phone mockups */
.phone{background:#fff;border:1.5px solid var(--line);border-radius:22px;padding:14px;box-shadow:0 6px 0 var(--line);font-size:14px}
.ph-top{display:flex;gap:12px;align-items:center}
.ava{width:62px;height:62px;border-radius:50%;flex:none;background:linear-gradient(135deg,#f0c9a6,#c98f6b);border:2.5px solid #fff;outline:2px solid #e3a1b4}
.stats{display:flex;gap:14px;font-size:12.5px;color:var(--soft)}
.stats b{display:block;color:var(--ink);font-size:15px}
.uname{font-weight:700;font-size:14.5px;margin-top:10px}
.bio{margin-top:2px;line-height:1.4}
.link{color:#2a5db0;margin-top:2px}
.hl{display:flex;gap:12px;margin-top:12px}
.hl span{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--soft)}
.hl span i{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:20px;background:#faf6ee}
.post{border:1.5px solid var(--line);border-radius:14px;padding:11px 13px;background:#fff;font-size:14.5px}
.post b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin-bottom:2px;font-weight:600}
.post .meta{display:block;margin-top:6px;font-size:12.5px;color:var(--soft)}
.posts{display:flex;flex-direction:column;gap:8px}
.chat{background:#e7efe9;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:7px;font-size:14px}
.chat .m{background:#fff;border-radius:4px 14px 14px 14px;padding:8px 11px;max-width:92%}
.chat .m.me{align-self:flex-end;background:#dff3d8;border-radius:14px 4px 14px 14px}
.chat ol{margin:4px 0 0;padding-left:20px;columns:2;column-gap:16px;font-size:13px}
.chat .bt{display:inline-block;margin-top:6px;background:var(--wine);color:#fff;border-radius:8px;padding:6px 12px;font-weight:600;font-size:13px}

/* hotspots */
[data-spot]{cursor:pointer;border-radius:10px;outline:2px dashed transparent;outline-offset:3px;transition:outline-color .2s,background .2s}
.hunt [data-spot]{outline-color:rgba(143,36,66,.28);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{outline-color:rgba(143,36,66,.6)}}
[data-spot].fine{outline:2px solid #9fd0b2;animation:none;background:var(--ok-soft)}
[data-spot].caught{outline:3px solid var(--wine);animation:none;background:var(--wine-soft)}
.hint{font-size:14px;color:var(--soft);display:flex;gap:6px;align-items:center}
.fb{border-radius:12px;padding:11px 14px;font-size:15px;animation:in .25s ease both}
.fb b{display:block;font:500 11px var(--display);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.fb.good{background:var(--ok-soft);color:#1d4d33}
.fb.good b{color:var(--ok)}
.fb.bad{background:var(--wine-soft);color:#5a1427}
.fb.bad b{color:var(--wine)}
.fb.clue{background:var(--green);color:#f3ede2}
.fb.clue b{color:var(--gold)}

/* compare */
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:440px){.vs{grid-template-columns:1fr}}
.opt{appearance:none;cursor:pointer;text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;font:inherit;color:inherit;box-shadow:0 3px 0 var(--line)}
.opt:hover{border-color:var(--wine)}
.opt .lab{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:#e2b7c3;opacity:.7}
.opt[disabled]{cursor:default}
.mini{font-size:14px;line-height:1.4}

.tip{background:var(--gold-soft);border:1.5px solid #ecd9ae;border-radius:14px;padding:12px 14px;font-size:15px}
.tip b{display:block;font:500 11px var(--display);letter-spacing:.06em;text-transform:uppercase;color:#9a6b12;margin-bottom:3px}

.stamp{align-self:flex-start;font:700 14px var(--display);letter-spacing:.06em;text-transform:uppercase;padding:7px 13px;border:3px solid currentColor;border-radius:8px;transform:rotate(-3deg)}
.stamp.bad{color:var(--wine)}
.stamp.good{color:var(--ok)}
.path{display:flex;flex-direction:column;gap:6px}
.path span{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:500;font-size:15px}
.path i{font-style:normal;color:var(--wine);font-weight:700;padding-left:14px;line-height:1}
.badge{display:flex;gap:14px;align-items:center;background:var(--green);color:#f3ede2;border-radius:18px;padding:14px 16px}
.badge-ic{font-size:40px;line-height:1}
.badge small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.badge b{display:block;font:500 18px var(--display)}
.badge span{font-size:13px;color:#b9c9bf}

.qprog{display:flex;gap:6px}
.qprog i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.qprog i.on{background:var(--gold)}.qprog i.now{background:var(--wine)}
.found,.get{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

.cta{background:var(--green);color:#f3ede2;border-radius:20px;padding:20px 18px;display:flex;flex-direction:column;gap:12px}
.cta h2{color:#fff}
.cta p,.cta li{color:#d9e3dc;font-size:15px}
.cta .bubble{color:var(--ink)}
.cta.alt{background:var(--card);color:var(--ink);border:1.5px dashed var(--soft)}
.cta.alt h2{color:var(--ink);font-size:18px}
.cta.alt p{color:var(--soft)}
.btn{display:block;text-align:center;text-decoration:none;cursor:pointer;font:600 16px/1.25 var(--body);padding:14px 16px;border-radius:12px;border:0;background:var(--gold);color:var(--green)}
.btn:hover{filter:brightness(1.05)}
.btn.wine{background:var(--wine);color:#fff}
.btn.line{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.tiers{display:flex;flex-direction:column;gap:10px}
.tier{background:rgba(255,255,255,.07);border:1.5px solid #3f6b58;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.tier b{font:500 15px var(--display);color:#fff}
.tier > span{font-size:14.5px;color:#d9e3dc}
.tier em{font-style:normal;font-size:13.5px;color:#b9c9bf}
.tier em b{font:600 13.5px var(--body);color:var(--gold)}
.tier.gold{border-color:var(--gold);background:rgba(216,173,91,.12)}
.tier small{font:600 10.5px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:400px){.tiers{display:flex;flex-direction:column;gap:10px}
.tier{background:rgba(255,255,255,.07);border:1.5px solid #3f6b58;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.tier b{font:500 15px var(--display);color:#fff}
.tier > span{font-size:14.5px;color:#d9e3dc}
.tier em{font-style:normal;font-size:13.5px;color:#b9c9bf}
.tier em b{font:600 13.5px var(--body);color:var(--gold)}
.tier.gold{border-color:var(--gold);background:rgba(216,173,91,.12)}
.tier small{font:600 10.5px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.btn-row{grid-template-columns:1fr}}
.word{font:500 13px var(--display);color:var(--gold)}
.cta.alt .word{color:var(--wine)}
.niches{display:flex;flex-wrap:wrap;gap:6px}
.niches span{background:var(--bg);border-radius:999px;padding:6px 11px;font-size:13.5px}

.toast{position:fixed;z-index:20;top:62px;left:50%;width:min(92vw,400px);transform:translate(-50%,-200%);transition:transform .45s cubic-bezier(.2,1.2,.4,1);background:#fff;border:1.5px solid var(--line);border-radius:16px;box-shadow:0 8px 24px rgba(18,58,44,.18);padding:10px 12px;display:flex;gap:10px;align-items:center;font-size:15px}
.toast.on{transform:translate(-50%,0)}
.toast small{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--wine)}
.toast .face{width:38px;height:38px}.toast .face svg{width:26px;height:26px}

.foot{max-width:560px;margin:28px auto 0;padding:0 16px;font-size:13px;color:var(--soft);text-align:center;line-height:1.9}
.foot a{color:var(--green-2)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const app = document.getElementById("app");
const caseEl = document.getElementById("case");
const MAXS = 8;

const ENDINGS = ["head","post","gift","bot","weak","win"];

try { JSON.parse(localStorage.getItem("detektiv-endings-2") || "[]").forEach(e => found.add(e)); } catch(e){}

function toast(text){
  const t = document.createElement("div"); t.className = "toast";
  t.innerHTML = `${face("marina")}<div><small>Марина пишет</small>${text}</div>`;
  document.body.appendChild(t);
  requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add("on")));
  setTimeout(() => { t.classList.remove("on"); setTimeout(() => t.remove(), 500); }, 4200);
}

function hub(){
  const n = clues.size;
  const hint = n === 0 ? "С чего начнём? Я бы начала с шапки - это первое, что видит человек."
    : n < 4 ? `Улик: ${n} из 4. Чувствую, тут работал не один. Обыщем остальное?`
    : "Все 4 места обысканы! Пора называть виновного.";
  render(`
    <span class="caption">Страница Марины · обыск</span>
    ${nadya(hint)}
    <div class="map">${ORDER.map(k => `<button class="loc${clues.has(k) ? " done" : ""}" id="loc-${k}"><span class="ic">${PLACES[k].ic}</span>${PLACES[k].name}<small>${PLACES[k].sub}</small></button>`).join("")}</div>
    ${n ? btns([["accuse", n < 4 ? "Назвать виновного сейчас" : "Назвать виновного", n < 4 ? "" : "primary"]]) : ""}
  `);
  ORDER.forEach(k => on("loc-" + k, () => { goal("loc_" + k); SCENES[k](); }));
  on("accuse", accuse);
}

/* ---------- механика 1: найди на экране ---------- */
// spots: {key:{bad:bool, t:"название", note:"..."}}; allNote - если есть, показываем кнопку «Тут всё мешает»
function hunt(k, intro, mock, spots, allNote){
  const bads = Object.keys(spots).filter(x => spots[x].bad);
  render(`
    <span class="caption">${PLACES[k].ic} ${PLACES[k].name}</span>
    ${intro}
    <div class="hunt" id="mock">${mock}</div>
    <p class="hint">👆 Нажмите на то, что кажется подозрительным${bads.length > 1 ? ` · подозреваемых тут ${bads.length}` : ""}</p>
    <div id="fb"></div>
    ${allNote ? btns([["all","🙈 Да тут всё мешает!"]]) : ""}
    <div id="fin"></div>
  `);
  let miss = 0, done = false; const caught = new Set();
  const fb = h => document.getElementById("fb").innerHTML = h;
  const finish = () => {
    done = true; if (!miss) point(k + "-find");
    const a = document.getElementById("all"); if (a) a.remove();
    document.getElementById("fin").innerHTML = btns([["next","Дальше →","primary"]]);
    on("next", () => COMPARE[k]());
  };
  document.querySelectorAll("[data-spot]").forEach(el => el.onclick = () => {
    if (done) return;
    const key = el.dataset.spot, sp = spots[key];
    if (sp.bad) {
      el.classList.add("caught"); caught.add(key);
      const left = bads.length - caught.size;
      fb(`<div class="fb clue"><b>Попался!${bads.length > 1 ? ` ${caught.size} из ${bads.length}` : ""}</b>${sp.note}${left ? `<br><br>Ищите дальше - тут прячется ещё ${left}.` : ""}</div>`);
      if (!left) finish();
    } else {
      miss++; el.classList.add("fine");
      fb(`<div class="fb good"><b>Тут всё в порядке</b>${sp.note}</div>`);
    }
  });
  on("all", () => {
    if (done) return;
    bads.forEach(x => document.querySelector(`[data-spot="${x}"]`).classList.add("caught"));
    fb(`<div class="fb clue"><b>Глаз-алмаз!</b>${allNote}<ul>${bads.map(x => `<li><b style="display:inline;font:inherit;color:var(--gold)">${spots[x].t}:</b> ${spots[x].note}</li>`).join("")}</ul></div>`);
    finish();
  });
}

/* ---------- механика 2: что лучше ---------- */
function compare(k, q, a, b, right, why){
  if (Math.random() < .5) { [a, b] = [b, a]; right = right === "a" ? "b" : "a"; }
  render(`
    <span class="caption">${PLACES[k].ic} ${PLACES[k].name} · как исправить</span>
    <h2>${q}</h2>
    <div class="vs">
      <button class="opt" id="oa"><span class="lab">Вариант 1</span>${a}</button>
      <button class="opt" id="ob"><span class="lab">Вариант 2</span>${b}</button>
    </div>
    <div id="fb"></div>
  `);
  const pick = v => {
    const ok = v === right;
    if (ok) point(k + "-fix");
    document.getElementById("o" + right).classList.add("right");
    document.getElementById("o" + (right === "a" ? "b" : "a")).classList.add("wrong");
    document.querySelectorAll(".opt").forEach(o => o.disabled = true);
    document.getElementById("fb").innerHTML = `<div class="fb ${ok ? "good" : "bad"}"><b>${ok ? "В точку" : "Не совсем"}</b>${why}</div>${btns([["next","Приколоть улику к делу →","primary"]])}`;
    on("next", () => clue(k));
  };
  on("oa", () => pick("a")); on("ob", () => pick("b"));
}

function clue(k){
  const first = !clues.has(k); clues.add(k);
  const p = PLACES[k];
  render(`
    <span class="caption">Улика ${clues.size} из 4</span>
    <div class="fb clue"><b>Улика: ${p.suspect}</b>${p.clue}</div>
    <div class="tip"><b>Проверьте у себя</b>${p.tip}</div>
    ${btns([["back","Вернуться к обыску","primary"],["ask",`Хочу, чтобы Надежда проверила мою страницу`]])}
    <div id="askbox"></div>
  `);
  on("back", hub);
  on("ask", () => {
    document.getElementById("askbox").innerHTML = `<div class="cta">
      ${nadya(`С радостью! Посмотрю ваш${p.my === "шапку" ? "у" : p.my === "посты" ? "и" : ""} ${p.my} и всю дорожку до покупки и подскажу, что исправить первым.`)}
      ${offerSteps()}
      <div class="btn-row"><a class="btn" href="${TG}" target="_blank" rel="noopener">Telegram</a><a class="btn wine" href="${IG}" target="_blank" rel="noopener">Директ</a></div>
      <p class="muted" style="color:#b9c9bf">Или продолжите расследование - в конце будет проверка всей вашей страницы.</p>
    </div>`;
    document.getElementById("ask").remove(); bindOffer();
    document.getElementById("askbox").scrollIntoView({behavior:"smooth", block:"start"});
  });
  if (first) setTimeout(() => toast(p.msg), 700);
}

      ${say("marina","Марина, через месяц","Детектив, у меня 14 заявок! Что мне теперь с ними делать?!",true)}`
      : `<div class="tip"><b>Вывод детектива</b>${e.lesson}</div>`}
    <div class="badge"><div class="badge-ic">🕵️</div><div><small>Ваше звание</small><b>${rank()}</b><span>Чутьё ${score} из ${MAXS} · улик ${clues.size} из 4</span></div></div>
    <div class="cta">
      ${nadya("Это было дело Марины. А теперь - ваше. Есть ли такие воры на вашей странице? Проверим за 30 секунд.")}
      <button class="btn" id="check">🔍 Проверить свою страницу</button>
    </div>
    <div class="tip"><b>Концовок найдено: ${found.size} из 6</b>Интересно, что было бы, если арестовать другого подозреваемого? Попробуйте - у каждого своя история.</div>
    ${btns([["other","Посмотреть другие концовки →"],["restart","Начать дело заново","ghost"]])}
  `);
  on("check", () => { goal("check_start"); check(0, []); }); on("other", accuse); on("restart", intro);
}

function offerSteps(){
  return `<div class="tiers">
      <div class="tier"><b>Короткий разбор</b><span>2-3 главные улики на вашей странице - текстом</span><em>Условие: просто напишите мне слово <span class="word">РАЗБОР</span> и ссылку на страницу</em></div>
      <div class="tier gold"><small>Бонус</small><b>Голосовой разбор на 5-7 минут</b><span>Пройду путь от шапки до покупки и расскажу, что исправить первым</span><em>Условие: выложите скрин игры в сторис, отметьте <b>@nadezhda_chansy</b>, добавьте ссылку на игру - и напишите <span class="word">РАЗБОР</span></em></div>
    </div>
    <button class="btn line light" data-copy>📋 Скопировать ссылку на игру</button>
    <div class="btn-row"><a class="btn" href="${TG}" target="_blank" rel="noopener" data-goal="click_tg">Написать в Telegram</a><a class="btn wine" href="${IG}" target="_blank" rel="noopener" data-goal="click_ig">Написать в Директ</a></div>`;
}
function offerCta(line){
  return `<div class="cta">
      ${nadya(line)}
      <h2>Разбор вашей страницы в подарок</h2>
      ${offerSteps()}
    </div>`;
}
function bindOffer(){
  document.querySelectorAll("[data-copy]").forEach(b => b.onclick = async () => {
    const url = location.href.split("#")[0];
    goal("copy_link");
    try { await navigator.clipboard.writeText(url); b.textContent = "✓ Ссылка скопирована"; }
    catch(e){ b.textContent = url; }
  });
}


/* ---------- проверка своей страницы ---------- */
const CHECK = [
  {q:"Глядя на вашу шапку, за 3 секунды понятно, кому вы помогаете и что можно взять бесплатно?", who:"🪪 Шапка-загадка"},
  {q:"В конце ваших постов есть приглашение: забрать подарок, написать вам, записаться?", who:"📝 Скучный пост"},
  {q:"Вы напоминаете о своём подарке хотя бы раз в неделю?", who:"🎁 Подарок-невидимка"},
  {q:"После подарка человеку понятно, что купить у вас дальше? Одно предложение, а не список всего", who:"🤖 Бот-витрина"}
];
function check(i, ans){
  if (i >= CHECK.length) return verdict(ans);
  render(`
    <span class="caption">Ваша страница · ${i + 1} из ${CHECK.length}</span>
    <div class="qprog">${CHECK.map((_, j) => `<i class="${j < i ? "on" : j === i ? "now" : ""}"></i>`).join("")}</div>
    <h2>${CHECK[i].q}</h2>
    ${btns([["yes","👍 Да"],["no","👎 Нет"],["idk","🤷 Не знаю"]])}
  `);
  const next = v => check(i + 1, ans.concat(v));
  on("yes", () => next("y")); on("no", () => next("n")); on("idk", () => next("?"));
}
function verdict(ans){
  goal("verdict");
  const bad = CHECK.filter((c, i) => ans[i] !== "y");
  const n = bad.length;
  render(`
    <span class="caption">Ваша страница · результат</span>
    ${n === 0
      ? `<span class="stamp good">Чисто</span><h2>Похоже, у вас всё на месте</h2><p class="lead">Но если заявок всё равно мало, вор хорошо прячется. Взгляд со стороны найдёт его быстрее.</p>`
      : `<span class="stamp bad">${n === 1 ? "1 подозреваемый" : n + " подозреваемых"}</span><h2>Кажется, у вас тоже крадут заявки</h2>
         <ul class="found">${bad.map(c => `<li>${c.who}</li>`).join("")}</ul>`}
    ${offerCta("Давайте я проведу такое расследование на вашей странице - по-настоящему. Выбирайте формат:")}
    ${gameCta()}
    ${btns([["restart","Сыграть ещё раз","ghost"]])}
  `);
  on("restart", intro); bindOffer();
}

function gameCta(){
  return `<div class="cta alt">
    <h2>Хотите такую игру на свою тему?</h2>
    <p>Сделаю для ваших клиентов в любой нише:</p>
    <div class="niches"><span>Косметолог: «Кто украл клиентов салона?»</span><span>Нутрициолог: «Кто съел результат?»</span><span>Стилист: «Кто испортил образ?»</span></div>
    <p>Напишите мне кодовое слово <span class="word">ИГРА</span></p>
    <div class="btn-row"><a class="btn line" href="${TG}" target="_blank" rel="noopener" data-goal="game_tg">Telegram</a><a class="btn line" href="${IG}" target="_blank" rel="noopener" data-goal="game_ig">Директ</a></div>
  </div>`;
}

intro();
</script>
</body>
</html>
