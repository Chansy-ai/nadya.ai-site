<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Делегировать или научиться</title>
<meta name="description" content="Игра для экспертов: как быстрее получить клиентов на консультации и курсы">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&display=swap">
<style>
/* Layout: a game screen - path map with 7 levels + XP counter on top, one question card below, a card-flip reveal with a reward at the end.
   Deliberately single dark look: forest green ground, wine for actions, brass for rewards. */
:root{
  --bg:#0e2019;
  --bg-2:#14301f;
  --panel:#183726;
  --panel-2:#1f4430;
  --line:#2d5540;
  --cream:#f4ede0;
  --muted:#b3c3b6;
  --wine:#8f2442;
  --wine-hi:#bb3d60;
  --brass:#d8ad5b;
  --leaf:#78c79c;
  --display:"Unbounded", "Arial Black", Arial, sans-serif;
  --body:"Golos Text", "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  background:
    radial-gradient(900px 500px at 85% -10%, rgba(143,36,66,.35), transparent 60%),
    radial-gradient(700px 500px at -10% 110%, rgba(120,199,156,.14), transparent 60%),
    var(--bg);
  color:var(--cream);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-inline:16px;padding-block:24px 48px;min-height:100vh;
}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.top b{color:var(--cream);font-weight:600}
.xp{font-family:var(--display);font-size:13px;letter-spacing:.02em;text-transform:none;color:var(--brass);background:rgba(216,173,91,.1);border:1px solid rgba(216,173,91,.35);padding:6px 12px;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* path map */
.map{display:flex;align-items:center;gap:0;padding:4px 2px}
.node{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--display);background:var(--panel);border:2px solid var(--line);color:var(--muted);transition:all .3s ease}
.node.done{background:var(--leaf);border-color:var(--leaf);color:var(--bg)}
.node.now{background:var(--wine);border-color:var(--wine-hi);color:var(--cream);box-shadow:0 0 0 5px rgba(187,61,96,.25);transform:scale(1.12)}
.node.chest{width:36px;height:36px;border-radius:10px;background:rgba(216,173,91,.12);border-color:var(--brass);color:var(--brass)}
.node.chest.open{background:var(--brass);color:var(--bg)}
.link{flex:1;height:3px;background:var(--line);border-radius:2px;min-width:6px}
.link.done{background:var(--leaf)}

.card{background:linear-gradient(180deg,var(--panel),var(--bg-2));border:1px solid var(--line);border-radius:22px;padding:30px 26px;display:flex;flex-direction:column;gap:20px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
@media (max-width:480px){.card{padding:24px 18px}}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(23px,5.4vw,32px);line-height:1.28}
h1 em{font-style:normal;color:var(--brass)}
h2{font-size:clamp(18px,4.2vw,22px);line-height:1.38}
h3{font-family:var(--body);font-size:17px;font-weight:600;line-height:1.4}
p{margin:0;max-width:62ch}
.lead{color:var(--muted);font-size:17px}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass);font-weight:600}

.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rule{background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:14px;padding:14px 12px;display:flex;flex-direction:column;gap:4px}
.rule b{font-family:var(--display);font-size:20px;color:var(--cream);font-variant-numeric:tabular-nums}
.rule span{font-size:13px;color:var(--muted);line-height:1.35}
@media (max-width:420px){.rules{grid-template-columns:1fr}.rule{flex-direction:row;align-items:baseline;gap:10px}}

.btn{appearance:none;border:0;cursor:pointer;font:600 16px/1.2 var(--body);letter-spacing:.01em;padding:17px 22px;text-align:center;border-radius:14px;background:var(--wine);color:var(--cream);text-decoration:none;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 6px 0 #5a1529;transition:transform .12s ease, box-shadow .12s ease, background .15s}
.btn:hover{background:var(--wine-hi)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #5a1529}
.btn.brass{background:var(--brass);color:var(--bg);box-shadow:0 6px 0 #9c7a35}
.btn.brass:hover{background:#e6bd6c}
.ghost{appearance:none;background:none;border:0;color:var(--muted);font:500 14px var(--body);cursor:pointer;padding:6px 0;align-self:flex-start}
.ghost:hover{color:var(--cream)}
:focus-visible{outline:3px solid var(--brass);outline-offset:3px}

.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.lvl{font:700 12px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--leaf)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{appearance:none;text-align:left;font:500 16px/1.45 var(--body);color:var(--cream);background:rgba(0,0,0,.22);border:1.5px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;display:flex;gap:14px;align-items:center;transition:border-color .15s, background .15s, transform .15s}
.opt:hover{border-color:var(--leaf);background:rgba(120,199,156,.08);transform:translateX(3px)}
.opt .key{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font:700 13px var(--display);background:var(--panel-2);color:var(--muted)}
.opt.picked{border-color:var(--brass);background:rgba(216,173,91,.12)}
.opt.picked .key{background:var(--brass);color:var(--bg)}
.opt:disabled{cursor:default}

/* toast */
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);background:var(--brass);color:var(--bg);font:700 14px var(--display);padding:12px 18px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:transform .35s cubic-bezier(.2,1.4,.4,1);z-index:10;white-space:nowrap}
.toast{visibility:hidden}
.toast.show{transform:translate(-50%,0);visibility:visible}

/* loader */
.load{display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center;padding-block:30px}
.spin{width:64px;height:64px;border-radius:16px;border:3px solid var(--brass);display:grid;place-items:center;font:700 22px var(--display);color:var(--brass);animation:wob 1s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg) scale(1.08)}}
.loadbar{width:100%;max-width:280px;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.loadbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--leaf),var(--brass));animation:fill 1.6s ease forwards}
@keyframes fill{to{width:100%}}

/* result */
.flip{perspective:1200px}
.flip-in{position:relative;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,1.3,.5,1)}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px}
.back-face{position:absolute;inset:0;background:repeating-linear-gradient(45deg,var(--wine) 0 14px,#7c1f39 14px 28px);border:2px solid var(--brass);display:grid;place-items:center;font:700 44px var(--display);color:var(--brass)}
.front-face{transform:rotateY(180deg);background:linear-gradient(160deg,var(--panel-2),var(--bg-2));border:2px solid var(--brass);padding:26px 22px;display:flex;flex-direction:column;gap:14px}
.arch-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.badge{flex:none;width:58px;height:58px;border-radius:16px;background:var(--brass);color:var(--bg);display:grid;place-items:center;font:700 24px var(--display)}
.stats{display:flex;flex-direction:column;gap:9px}
.stat{display:grid;grid-template-columns:128px 1fr 42px;gap:10px;align-items:center;font-size:14px;color:var(--muted)}
.stat .bar{height:8px;background:rgba(0,0,0,.3);border-radius:99px;overflow:hidden}
.stat .bar i{display:block;height:100%;width:0;background:var(--leaf);border-radius:99px;transition:width 1s ease .9s}
.stat.win{color:var(--cream);font-weight:600}
.stat.win .bar i{background:var(--brass)}
.stat span:last-child{text-align:right;font-variant-numeric:tabular-nums}

.reward{border:1.5px dashed var(--brass);border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:14px;background:rgba(216,173,91,.06)}
.reward ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.reward li{display:flex;justify-content:space-between;gap:16px;align-items:baseline;padding-bottom:10px;border-bottom:1px solid var(--line)}
.reward li:last-child{border-bottom:0;padding-bottom:0}
.reward li span{white-space:nowrap;color:var(--brass);font-weight:500;font-variant-numeric:tabular-nums}
.price{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.price strong{font:700 34px var(--display);color:var(--brass)}
.price s{color:var(--muted)}
.chip{font-size:12px;padding:5px 10px;border-radius:999px;background:var(--wine);color:var(--cream);font-weight:600}
.code{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:rgba(0,0,0,.25);border-radius:14px;padding:14px 16px}
.code-word{font:500 20px var(--display);color:var(--cream);letter-spacing:.05em;user-select:all;overflow-wrap:anywhere}
.copy{appearance:none;border:1.5px solid var(--brass);background:transparent;color:var(--brass);font:600 14px var(--body);padding:10px 14px;border-radius:10px;cursor:pointer}
.small{font-size:14px;color:var(--muted)}
.small b{color:var(--cream);font-weight:500;user-select:all}
.meta-case{border-top:1px solid var(--line);padding-top:18px;display:flex;flex-direction:column;gap:10px}
.ghostbtn{background:transparent;border:1.5px solid var(--brass);color:var(--brass);box-shadow:none}
.ghostbtn:hover{background:rgba(216,173,91,.12)}
.ghostbtn:active{transform:none;box-shadow:none}
.gamecta{background:linear-gradient(150deg,var(--wine),#5e1830);border:1.5px solid var(--brass);border-radius:20px;padding:22px 20px;display:flex;flex-direction:column;gap:12px}
.gamecta .eyebrow{color:var(--brass)}
.gamecta h2{color:var(--cream)}
.gamecta p{color:#ecdcd8;font-size:15px}
.gamecta .btn{align-self:stretch}
.showcase{display:flex;flex-direction:column;gap:16px;padding-top:6px}
.niches{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.niches{grid-template-columns:1fr}}
.niche{background:rgba(0,0,0,.25);border:1px solid rgba(216,173,91,.35);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.niche .who-n{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--brass);font-weight:600}
.niche .game{color:var(--cream);font-weight:500;line-height:1.4}
.niche .lead-to{font-size:14px;color:#dcc9c5;line-height:1.45}
.gives{display:flex;flex-wrap:wrap;gap:8px}
.gives span{font-size:13px;padding:6px 11px;border-radius:999px;background:rgba(0,0,0,.25);color:var(--cream)}
.introlink{appearance:none;background:rgba(216,173,91,.08);border:1px dashed var(--brass);color:var(--cream);font:500 15px/1.45 var(--body);text-align:left;padding:14px 16px;border-radius:14px;cursor:pointer}
.introlink b{color:var(--brass);font-weight:600}

.host{display:flex;gap:14px;align-items:center}
.ava{flex:none;width:68px;height:68px;border-radius:50%;object-fit:cover;object-position:center 20%;border:2px solid var(--brass);box-shadow:0 0 0 4px rgba(216,173,91,.15)}
.ava.sm{width:30px;height:30px;border-width:1.5px;box-shadow:none}
.bubble{min-width:0;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:11px 14px;font-size:14px;line-height:1.45;color:var(--cream)}
.bubble b{color:var(--brass);font-weight:600}
.who{display:flex;align-items:center;gap:10px}
.steps{display:flex;flex-direction:column;gap:10px}
.stepline{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--cream)}
.stepline .num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--brass);color:var(--bg);display:grid;place-items:center;font:700 12px var(--display)}
.backbtn{appearance:none;align-self:flex-start;background:transparent;border:1.5px solid var(--line);color:var(--cream);font:500 14px var(--body);padding:11px 16px;border-radius:12px;cursor:pointer}
.backbtn:hover{border-color:var(--leaf)}
.how{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.how li{padding-left:4px}
.how li::marker{color:var(--brass);font-weight:700}
.more{border-top:1px solid var(--line);padding-top:18px;display:flex;flex-direction:column;gap:14px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:9}
.screen{animation:in .4s ease both}
@keyframes in{from{opacity:.3;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .screen,.spin{animation:none}.flip-in,.stat .bar i,.toast,.node{transition:none}
  .loadbar i{animation:none;width:100%}
}
</style>
<style>body{margin:0}[hidden]{display:none!important}</style>

function showcaseHTML(id){

  <div class="showcase" id="${id}" hidden>

function bindToggle(btnId, panelId, openText, closeText){
  const b = document.getElementById(btnId), p = document.getElementById(panelId);
  b.onclick = () => { p.hidden = !p.hidden; b.innerHTML = p.hidden ? openText : closeText; b.setAttribute("aria-expanded", String(!p.hidden)); };
}

const app = document.getElementById("app");
const mapEl = document.getElementById("map");
const xpEl = document.getElementById("xp");
const toastEl = document.getElementById("toast");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let step = -1, answers = [], xp = 0, shownXp = 0, chestOpen = false, order = [];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function drawMap(){
  let h = "";
  for (let i = 0; i < Q.length; i++){
    const cls = i < step ? "done" : i === step ? "now" : "";
    h += `<div class="node ${cls}">${i+1}</div><div class="link ${i < step ? "done" : ""}"></div>`;
  }
  h += `<div class="node chest ${chestOpen ? "open" : ""}">★</div>`;
  mapEl.innerHTML = h;
}

function addXp(n){
  xp += n;
  if (reduce){ shownXp = xp; xpEl.textContent = xp + " XP"; return; }
  const from = shownXp, to = xp, t0 = performance.now();
  (function tick(t){
    const k = Math.min(1, (t - t0) / 600);
    shownXp = Math.round(from + (to - from) * k);
    xpEl.textContent = shownXp + " XP";
    if (k < 1) requestAnimationFrame(tick);
  })(t0);
}

let toastTimer;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1500);
}

function intro(){
  step = -1; answers = []; xp = 0; shownXp = 0; chestOpen = false;
  order = Q.map(q => shuffle(q.o.map((_,i)=>i)));
  xpEl.textContent = "0 XP";
  drawMap();
  app.innerHTML = `
  <div class="screen" style="display:flex;flex-direction:column;gap:20px">
    <div class="host"><img class="ava" src="${AVA}" alt="Надежда Базарова"><div class="bubble">Привет! Я <b>Надежда</b>, маркетолог и ведущая этой игры. Помогу понять, как вам быстрее прийти к клиентам и продажам.</div></div>
    <span class="eyebrow">Для психологов, коучей, наставников и экспертов, которые продают свои знания онлайн</span>
    <h1>Как быстрее получить клиентов на свои <em>консультации и курсы?</em></h1>
    <p class="lead">Чтобы клиенты приходили онлайн, нужны продающие посты, прогревы, подарок для подписчиков и понятный путь клиента от знакомства с вами до покупки. Всё это можно отдать специалисту, а можно научиться делать самостоятельно с помощью нейросетей.</p>
    <p class="lead">Ответьте на 7 вопросов, узнайте свой тип и получите пошаговый план, как быстрее прийти к продажам.</p>
    <div class="rules">
      <div class="rule"><b>7</b><span>вопросов-уровней</span></div>
      <div class="rule"><b>1 мин</b><span>на всю игру</span></div>
      <div class="rule"><b>★</b><span>план и диагностика в подарок</span></div>
    </div>
    <button class="btn" id="start">Начать игру</button>
    <button class="introlink" id="intro-more" aria-expanded="false">Вы эксперт, блогер или ведёте свой бизнес? <b>Такую игру можно сделать и для вас →</b></button>
    ${showcaseHTML("intro-show")}
  </div>`;
  document.getElementById("start").onclick = () => { step = 0; question(); };
  bindToggle("intro-more","intro-show","Вы эксперт, блогер или ведёте свой бизнес? <b>Такую игру можно сделать и для вас →</b>","Скрыть примеры <b>↑</b>");
}

function question(){
  drawMap();
  const item = Q[step];
  const keys = ["A","B","C"];
  app.innerHTML = `
  <div class="screen" style="display:flex;flex-direction:column;gap:20px">
    <div class="qhead"><span class="lvl">Уровень ${step+1} из ${Q.length}</span></div>
    <h2>${item.q}</h2>
    <div class="opts">${order[step].map((oi,i)=>{const o=item.o[oi];return `<button class="opt${answers[step]===o[1]?' picked':''}" data-v="${o[1]}" id="opt-${step}-${oi}"><span class="key">${keys[i]}</span><span>${o[0]}</span></button>`}).join("")}</div>
    ${step>0?'<button class="backbtn" id="back">← Вернуться к прошлому вопросу</button>':''}
  </div>`;
  const btns = app.querySelectorAll(".opt");
  btns.forEach(b => b.onclick = () => {
    btns.forEach(x => { x.disabled = true; x.classList.remove("picked"); });
    b.classList.add("picked");
    const first = answers[step] === undefined;
    answers[step] = b.dataset.v;
    if (first){
      addXp(100);
      if (step === 0) toast("Достижение: первый шаг · +100 XP");
      else if (step === 3) toast("Полпути пройдено · +100 XP");
      else if (step === Q.length - 1) toast("Все уровни пройдены · +100 XP");
      else toast("+100 XP");
    }
    setTimeout(() => { step++; step < Q.length ? question() : loading(); }, reduce ? 200 : 750);
  });
  const back = document.getElementById("back");
  if (back) back.onclick = () => { step--; question(); };
}

function loading(){
  drawMap();
  app.innerHTML = `
  <div class="screen load">
    <div class="spin">★</div>
    <h2>Открываем сундук</h2>
    <p class="small">Собираем ваш профиль по 7 ответам</p>
    <div class="loadbar"><i></i></div>
  </div>`;
  setTimeout(result, reduce ? 300 : 1700);
}

function winner(){
  const c = {D:0,S:0,L:0};
  answers.forEach(a => c[a]++);
  let w = "S";
  if (c.D > c.S && c.D >= c.L) w = "D";
  else if (c.L > c.S && c.L > c.D) w = "L";
  return {w, c};
}

function result(){
  chestOpen = true; drawMap();
  addXp(300);
  const {w, c} = winner();
  const r = R[w];
  const stats = ["D","S","L"].map(k => {
    const p = Math.round(c[k] / Q.length * 100);
    return `<div class="stat${k===w?' win':''}"><span>${R[k].axis}</span><div class="bar"><i data-w="${p}"></i></div><span>${p}%</span></div>`;
  }).join("");
  const offer = r.course ? `
      <h3>${r.course.title}</h3>
      <p><b style="font-weight:600">${r.course.name}</b>. ${r.course.text}</p>

      <p class="small">Кодовое слово для интенсива: <b>${r.course.word}</b></p>
      <a class="btn ghostbtn" id="tg2" href="${TG}?text=${encodeURIComponent(r.course.word)}" target="_blank" rel="noopener">Записаться: отправить слово ${r.course.word}</a>`
    : `<h3>${r.moreTitle}</h3><ul>${r.list.map(l=>`<li><span style="color:var(--cream);white-space:normal;font-weight:400;flex:1;min-width:0">${l[0]}</span>${l[1]?`<span>${l[1]}</span>`:''}</li>`).join("")}</ul>`;

  app.innerHTML = `
  <div class="screen" style="display:flex;flex-direction:column;gap:22px">
    <span class="eyebrow">Ваш тип · +300 XP за прохождение</span>
    <div class="flip" id="flip">
      <div class="flip-in">
        <div class="face back-face">?</div>
        <div class="face front-face">
          <div class="arch-row">
            <div style="display:flex;flex-direction:column;gap:6px;min-width:0">
              <h1>${r.arch}</h1>
              <p class="small">${r.tagline}</p>
            </div>
            <div class="badge">${r.badge}</div>
          </div>
          <p>${r.text}</p>
          <div class="stats">${stats}</div>
        </div>
      </div>
    </div>

    <div class="reward">
      <span class="eyebrow">Награда открыта</span>
      <h2>Ваш пошаговый план и бесплатная диагностика</h2>
      <p class="small">Что будет, когда вы напишете мне кодовое слово:</p>
      <ol class="how">
        <li>Задам 3 коротких вопроса о вашем деле</li>
        <li>Бесплатно за 15 минут разберу, что у вас уже есть и где теряются клиенты</li>
        <li>Пришлю пошаговый план для типа «${r.arch}»: ${r.plan}</li>
      </ol>
      <div class="steps">
        <div class="stepline"><span class="num">1</span><span>Скопируйте кодовое слово для плана и диагностики</span></div>
        <div class="code">
          <span class="code-word" id="word">${r.word}</span>
          <button class="copy" id="copy">Скопировать</button>
        </div>
        <div class="stepline"><span class="num">2</span><span>Нажмите кнопку и отправьте это слово мне в Telegram</span></div>
      </div>
      <div class="host"><img class="ava" src="${AVA}" alt="Надежда Базарова"><div class="bubble">Жду ваше слово <b>${r.word}</b>. Отвечаю лично, это не бот.</div></div>
      <a class="btn" id="tg" href="${TG}?text=${encodeURIComponent(r.word)}" target="_blank" rel="noopener">Забрать план и диагностику</a>
      <p class="small">Или найдите меня вручную: <b>${TG_NAME}</b></p>
      <div class="more">${offer}</div>

      <p>Эту игру сделала я. Соберу похожую для вас: с вашими вопросами, фото, цветами и предложением в конце.</p>

  </div>`;

  requestAnimationFrame(() => setTimeout(() => {
    document.getElementById("flip").classList.add("on");

  }, reduce ? 0 : 250));

      const s = getSelection(); s.removeAllRanges(); s.addRange(rng);
      cp.textContent = "Выделено";
    };
    try { navigator.clipboard.writeText(r.word).then(() => cp.textContent = "Скопировано", sel); }
    catch(e){ sel(); }
  };
  document.getElementById("tg").addEventListener("click", () => { try { navigator.clipboard.writeText(r.word).catch(()=>{}); } catch(e){} });
  const tg2 = document.getElementById("tg2");
  if (tg2) tg2.addEventListener("click", () => { try { navigator.clipboard.writeText(r.course.word).catch(()=>{}); } catch(e){} });
  bindToggle("res-more","res-show","Посмотреть, какие игры можно сделать ↓","Скрыть примеры ↑");
  document.getElementById("again").onclick = intro;
  window.scrollTo({top:0, behavior: reduce ? "auto" : "smooth"});

function confetti(){
  if (reduce) return;
  const cv = document.getElementById("fx"), ctx = cv.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  ctx.scale(dpr, dpr);
  const colors = ["#d8ad5b","#bb3d60","#78c79c","#f4ede0"];
  const parts = Array.from({length:110}, () => ({
    x: innerWidth/2 + (Math.random()-.5)*80, y: innerHeight*.35,
    vx:(Math.random()-.5)*11, vy:-Math.random()*11-4,
    s:Math.random()*7+4, r:Math.random()*6, vr:(Math.random()-.5)*.3,
    c:colors[Math.floor(Math.random()*colors.length)]
  }));
  const t0 = performance.now();
  (function frame(t){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    parts.forEach(p => {
      p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore();
    });
    if (t - t0 < 2600) requestAnimationFrame(frame);
    else ctx.clearRect(0,0,innerWidth,innerHeight);
  })(t0);
}
