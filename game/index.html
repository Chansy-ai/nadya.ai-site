<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сезон привычек</title>
<meta name="description" content="Игра на 90 дней: шесть сфер, героиня, кот Пряник, сундучок приятностей и праздничный режим на Новый год.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Nunito:wght@400;700;800&family=Playfair+Display:wght@600;700&subset=cyrillic&display=swap" rel="stylesheet">
<style>
:root{--g1:#0f2a22;--g2:#1c4a34;--gold:#e9b72f;--gold2:#c98a1c;--wine:#8a2346;--cream:#f7efdc;--ink:#2a1a14;--muted:#6f5d52}
body[data-season=sneg]{--g1:#11262f;--g2:#1f4a57}
body[data-season=prazdnik]{--g1:#1d1030;--g2:#4a2438}
body[data-season=belaya]{--g1:#1a3a30;--g2:#2f6a55}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--g1),var(--g2)) fixed;min-height:100vh;line-height:1.45}
body.noscroll{overflow:hidden}
#app{max-width:520px;margin:0 auto;padding:14px 14px 96px}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;margin:0 0 6px;line-height:1.2}
h2{font-size:21px}h3{font-size:18px}
p{margin:0 0 10px}
.muted{color:var(--muted)}.small{font-size:13px}
.top{color:var(--cream);text-align:center;padding:6px 0 12px}
.top .kicker{color:var(--gold);letter-spacing:.14em;text-transform:uppercase;font-size:12px;font-weight:800}
.top h1{font-size:30px;color:#fff;margin:2px 0}
.top .sub{opacity:.9;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.chips span{background:rgba(255,255,255,.13);border:1px solid rgba(233,183,47,.5);padding:4px 10px;border-radius:99px;font-size:13px;font-weight:700}
.card{background:var(--cream);border:2px solid #1e1209;border-radius:18px;box-shadow:5px 5px 0 var(--wine);padding:14px;margin:0 0 16px}
.card.scene{padding:10px}
.scene svg{display:block;width:100%;height:auto;border-radius:12px;border:2px solid #1e1209}
.bubble{margin-top:10px;background:#fff;border:2px solid #1e1209;border-radius:14px;padding:10px 12px;font-family:'Marck Script','Nunito',cursive;font-size:18px;line-height:1.35;position:relative}
.bubble b{color:var(--wine)}
.btn{display:inline-block;cursor:pointer;font:inherit;font-weight:800;color:var(--ink);background:#fff;border:2px solid #1e1209;border-radius:12px;padding:10px 16px;text-decoration:none;box-shadow:3px 3px 0 #1e1209;margin-top:6px}
.btn.gold{background:var(--gold)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.small{padding:6px 12px;font-size:14px}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #1e1209}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.habit{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px dashed #cdbba0}
.habit:first-of-type{border-top:0}
.hi{flex:0 0 42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px;border:2px solid #1e1209}
.ht{flex:1;min-width:0}
.hs{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.hn{font-weight:700;overflow-wrap:anywhere}
.link{background:none;border:0;padding:0;color:var(--wine);font:inherit;font-size:12px;text-decoration:underline;cursor:pointer}
.chk{flex:0 0 auto;cursor:pointer;font:inherit;font-weight:800;border:2px solid #1e1209;border-radius:12px;padding:9px 12px;background:var(--gold);box-shadow:3px 3px 0 #1e1209;min-width:104px}
.chk[disabled]{opacity:.45;cursor:default}
.habit.done .chk{background:#2f6b4f;color:#fff}
.habit.done .hn{text-decoration:line-through;opacity:.7}
.next{margin-top:8px;margin-bottom:0}
.notice{background:#fff3d6}
.holiday{background:#ffe9ec}
.pred .env{font-weight:800}
.pred.open{background:#fff8e1}
.predtxt{font-family:'Marck Script','Nunito',cursive;font-size:20px;margin:6px 0 0}
.quest.done{background:#e6f3ea}
.keycard{text-align:center}
.finale-card{text-align:center;background:#fff3d6}
.garden{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pot{background:#fff;border:2px solid #1e1209;border-radius:14px;padding:8px;text-align:center}
.pot svg{width:78px;height:auto}
.pot.lock{opacity:.5;filter:grayscale(.7)}
.pn{font-weight:800}
.pd{font-size:13px;overflow-wrap:anywhere}
.bar{height:8px;background:#e5d8bf;border-radius:99px;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--gold)}
.bar.big{height:12px;margin:8px 0 12px}
.wardrobe{list-style:none;margin:0;padding:0}
.wardrobe li{padding:5px 0;border-top:1px dashed #cdbba0}
.wardrobe li.on{font-weight:800;color:#2f6b4f}
.weeks{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.wk{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid #1e1209;border-radius:12px;padding:8px}
.wk .wn{flex:0 0 34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:#e5d8bf;border:2px solid #1e1209}
.wk.cur{background:#fff3d6;box-shadow:3px 3px 0 var(--gold2)}
.wk.cur .wn{background:var(--gold)}
.wk.past .wn{background:#2f6b4f;color:#fff}
.wk.fut{opacity:.6}
.wk .wt{flex:1}
.wk .wc{font-weight:800}
.star{background:var(--gold);border-radius:99px;padding:1px 8px;font-size:12px;font-weight:800;margin-left:4px}
.chestcard{text-align:center}
.chestimg svg{width:150px;height:auto}
.chestimg.small svg{width:120px}
.keyline{font-size:18px;margin:6px 0}
.prize{border-top:1px dashed #cdbba0;padding:10px 0}
.prize .pt{font-weight:800;color:var(--wine)}
.prize.card,.prize.holiday .pt{color:#a8456b}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;font-size:12px}
.stats b{display:block;font-size:22px;font-family:'Playfair Display',Georgia,serif}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{text-align:center;background:#fff;border:2px solid #1e1209;border-radius:12px;padding:8px 4px;cursor:pointer;filter:grayscale(1);opacity:.4}
.badge.on{filter:none;opacity:1;background:#fff8e1}
.bi{font-size:26px}.bt{font-size:12px;font-weight:800;line-height:1.2}
.lbl{display:block;font-weight:800;font-size:14px;margin:8px 0}
.lbl input{display:block;width:100%;margin-top:4px;font:inherit;font-weight:600;padding:10px 12px;border:2px solid #1e1209;border-radius:10px;background:#fff}
.ad{display:flex;gap:12px;align-items:flex-start;background:#fff3d6}
.ava{position:relative;flex:0 0 64px;height:64px;border-radius:50%;background:var(--wine);color:var(--gold);display:grid;place-items:center;font-family:'Playfair Display',Georgia,serif;font-size:30px;font-weight:700;border:2px solid #1e1209;overflow:hidden}
.ava img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.adt h3{margin-bottom:4px}
.foot{text-align:center;color:var(--cream);opacity:.8;font-size:13px;margin:6px 0 10px}
.foot a{color:var(--gold)}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:#0b1f18;border-top:2px solid var(--gold);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
.nav button{flex:1;max-width:100px;background:none;border:0;color:#cdd8d2;font:inherit;font-size:12px;font-weight:700;cursor:pointer;padding:4px 0;border-radius:10px}
.nav button span{display:block;font-size:20px}
.nav button.on{color:var(--gold);background:rgba(233,183,47,.12)}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}
.modal{position:relative;background:var(--cream);border:2px solid #1e1209;border-radius:18px;box-shadow:6px 6px 0 var(--wine);padding:18px;max-width:480px;width:100%;max-height:90vh;overflow:auto}
.modal .x{position:absolute;right:8px;top:6px;border:0;background:none;font-size:28px;line-height:1;cursor:pointer;color:var(--ink)}
.chips2{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{cursor:pointer;font:inherit;font-weight:700;font-size:14px;padding:7px 11px;border-radius:99px;border:2px solid #1e1209;background:#fff;text-align:left}
.chip.on{background:var(--gold)}
.how{padding-left:20px;margin:10px 0}
.how li{margin-bottom:6px}
.welcome .kicker{color:var(--wine);font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:12px}
.prizebox{text-align:center}
.prizebox .big,.finale .big{font-family:'Marck Script','Nunito',cursive;font-size:21px}
.rar{display:inline-block;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.08em;padding:2px 10px;border-radius:99px;background:#e5d8bf}
.rar.rare{background:var(--gold)}
.wallimg{max-width:70%;border:2px solid #1e1209;border-radius:12px;display:block;margin:8px auto}
.cert{width:100%;border:2px solid #1e1209;border-radius:12px;margin:8px 0}
.fscene svg{width:100%;height:auto;border-radius:12px;border:2px solid #1e1209}
.toasts{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:70;pointer-events:none;width:90vw;max-width:480px}
.toast{background:#1e1209;color:#fff;border:2px solid var(--gold);border-radius:14px;padding:9px 14px;font-weight:700;font-size:14px;max-width:90vw;text-align:center;animation:tin .25s ease}
.toast.out{opacity:0;transition:opacity .5s}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:80}
.confetti i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.confetti i{animation-duration:.01s}}

.warn{background:#fff3d6;border:2px solid #1e1209;border-radius:10px;padding:8px 10px}

.links a{color:var(--wine);font-weight:700}

</style>
</head>

<script>

  { id: 'listopad', name: 'Листопад',         from: 1,  to: 28, emoji: '🍂', desc: 'Сад только просыпается. Привычки приходят по одной.' },
  { id: 'sneg',     name: 'Первый снег',      from: 29, to: 56, emoji: '❄️', desc: 'Последние сферы и закрепление. Корни идут вглубь.' },

/* НЕДЕЛЯ 2 - Порядок */

function starPath(cx, cy, r) {
  let p = '';
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const rr = i % 2 === 0 ? r : r * 0.45;
    p += (i ? 'L' : 'M') + (cx + rr * Math.cos(a)).toFixed(1) + ' ' + (cy + rr * Math.sin(a)).toFixed(1);
  }
  return p + 'Z';
}

function windowView(deco, uid) {
  const t = SCENE_THEME;
  let s = '';
  if (deco === 'leaves') {
    const L = [[40, '#c2562b', 0], [66, '#e08a2b', 1.2], [92, '#b8431f', 0.6], [54, '#e9b72f', 1.8], [80, '#d9722b', 2.4]];
    L.forEach((l, i) => {
      s += `<ellipse cx="${l[0]}" cy="34" rx="5" ry="3" fill="${l[1]}" transform="rotate(${20 + i * 30} ${l[0]} 34)"><animate attributeName="cy" values="34;100;34" dur="${6 + i}s" begin="${l[2]}s" repeatCount="indefinite"/></ellipse>`;
    });
  } else if (deco === 'snow') {
    for (let i = 0; i < 9; i++) {
      const x = 32 + i * 9;
      s += `<circle cx="${x}" cy="34" r="${1.6 + (i % 3) * 0.6}" fill="#fff"><animate attributeName="cy" values="32;102;32" dur="${5 + (i % 4)}s" begin="${i * 0.5}s" repeatCount="indefinite"/></circle>`;
    }
  } else if (deco === 'stars') {
    s += `<circle cx="96" cy="46" r="9" fill="#f6e7b0"/><circle cx="100" cy="43" r="8" fill="#2b2f5e"/>`;
    [[38, 44], [58, 62], [78, 40], [48, 86], [90, 82], [66, 90]].forEach((p, i) => {
      s += `<path d="${starPath(p[0], p[1], 3.4)}" fill="#f6d77a"><animate attributeName="opacity" values="1;.3;1" dur="${2 + i * 0.4}s" repeatCount="indefinite"/></path>`;
    });
  } else {
    s += `<circle cx="70" cy="104" r="26" fill="#fff3c4" opacity=".95"/>`;
    for (let i = 0; i < 7; i++) {
      const a = Math.PI + (i + 0.5) * Math.PI / 7;
      s += `<path d="M70 104 L${(70 + 52 * Math.cos(a)).toFixed(1)} ${(104 + 52 * Math.sin(a)).toFixed(1)}" stroke="#fff3c4" stroke-width="3" opacity=".6"/>`;
    }
  }
  return s;
}

  /* ---------- действия ---------- */
  function setCheck(id, val) {

    if (activeSpheres(DAY).indexOf(id) < 0) return;
    var old = JSON.parse(JSON.stringify(S.checks[DAY] || {})), wasFull = isFull(DAY);
    if (!S.checks[DAY]) S.checks[DAY] = {};
    if (val) S.checks[DAY][id] = 1; else delete S.checks[DAY][id];
    if (!val && derive().keys < 0) { S.checks[DAY] = old; toast('Ключ за этот день уже потрачен, отметку снять нельзя'); return; }
    if (S.joinDay === null) S.joinDay = Math.max(1, DAY);
    afterChange(); render();
    if (val) {
      var nowFull = isFull(DAY);
      if (nowFull && !wasFull) { confetti(50); toast('Полный день! +1 ключ 🔑'); }
      else toast('+10 XP');
      if (MILESTONES[DAY] && checkedList(DAY).length === 1) { confetti(70); toast('Секретный день! +' + MILESTONES[DAY] + ' ключа'); }
    }
  }
  function toggleCheck(id) { var cur = (S.checks[DAY] || {})[id]; setCheck(id, !cur); }

  function toggleQuest() {
    if (!isHoliday(DAY)) return;
    var was = S.quests[DAY];
    if (was) { delete S.quests[DAY]; if (derive().keys < 0) { S.quests[DAY] = 1; toast('Ключ уже потрачен, отметку снять нельзя'); return; } }
    else S.quests[DAY] = 1;
    afterChange(); render(); if (!was) { confetti(30); toast('Праздничное задание выполнено! +1 ключ'); }
  }

  function useShield(day) {
    var st = derive(); if (st.shields <= 0 || covered(day)) return;
    S.shieldDays[day] = 1; afterChange(); render(); toast('Щит поднят. Серия сохранена 🛡');
  }

  function drawPrize() {
    var owned = {}; S.prizes.forEach(function (p) { owned[p.id] = 1; });
    var hol = isHoliday(DAY);
    var pool = PRIZES.filter(function (p) { return !owned[p.id] && (p.type !== 'holiday' || hol); });
    var pick = null;
    if (hol) { var hp = pool.filter(function (p) { return p.type === 'holiday'; }); if (hp.length && Math.random() < 0.5) pick = hp[rnd(hp.length)]; }
    if (!pick) {
      var rare = pool.filter(function (p) { return p.rarity === 'rare' && p.type !== 'holiday'; }), com = pool.filter(function (p) { return p.rarity === 'common'; });
      var arr = (Math.random() < 0.28 && rare.length) ? rare : (com.length ? com : (rare.length ? rare : pool));
      if (arr.length) pick = arr[rnd(arr.length)];
    }
    if (!pick) { var all = PRIZES.filter(function (p) { return p.type !== 'holiday' || hol; }); pick = all[rnd(all.length)]; }
    return pick;
  }

      '<ul class="how"><li>Каждую неделю открывается новая сфера: тело, порядок, радость, голова, люди и своя.</li><li>Привычку вы выбираете сами. Она занимает две минуты, не час.</li><li>За полный день вы получаете ключ, а ключ открывает сундучок приятностей.</li><li>Растения в саду растут, героиня меняется, а в комнате становится уютнее.</li><li>Есть щиты от пропусков, значки и праздничный режим на Новый год.</li></ul>' +
      '<p class="muted small"><b>Важно:</b> игра хранит прогресс в браузере. Заходите с одного устройства, по одной ссылке и в одном браузере. Добавьте ссылку в закладки или на главный экран телефона.</p>' +
      '<button class="btn gold" data-act="welcomeNext">Начать</button> <button class="btn ghost small" data-act="restoreOpen">Уже играли? Восстановить</button></div>', false);
  }
  function showNames() {
    showModal('<h2>Знакомство</h2><label class="lbl">Как вас зовут? <span class="muted">(можно пропустить)</span><input id="nmPlayer" maxlength="20" placeholder="Ваше имя"></label>' +
      '<label class="lbl">Как зовут героиню?<input id="nmHero" maxlength="20" placeholder="Придумайте имя"></label><div class="chips2">' +
      heroNames.map(function (n) { return '<button class="chip" data-act="setHero" data-n="' + n + '">' + n + '</button>'; }).join('') + '<button class="chip" data-act="heroMyName">Моё имя</button></div>' +
      '<p class="muted small">Героиня может носить любое имя. Назовите её по-своему, она не обидится.</p><button class="btn gold" data-act="namesDone">Дальше</button>', false);
  }
  function namesDone() {
    var p = document.getElementById('nmPlayer').value.trim(), hn = document.getElementById('nmHero').value.trim();
    S.player = p; S.heroine = hn || 'Мира'; S.started = true; S.joinDay = Math.max(1, DAY);
    save(); closeModal(true); render(); setTimeout(ensureChoices, 80);
  }

  /* ---------- восстановление прогресса ---------- */
  function showRestore() {
    if (DAY < 2) { showModal('<h2>Восстанавливать пока нечего</h2><p>Сезон начинается ' + dateStr(1) + '. Если сегодня первый день, просто начните игру.</p><button class="btn" data-act="close">Понятно</button>'); return; }
    var last = Math.min(DAY - 1, TOTAL_DAYS);
    showModal('<h2>Восстановить прогресс</h2><p class="muted">Игра хранит прогресс в браузере. Если он пропал, можно восстановить: все дни до сегодняшнего отметятся выполненными. Привычки придётся выбрать заново. Это работает по честному слову, так что отмечайте только то, что действительно делали.</p>' +
      (S.started ? '<p class="warn"><b>Внимание:</b> текущий прогресс на этом устройстве будет заменён.</p>' : '') +
      '<label class="lbl">Имя героини<input id="rsHero" maxlength="20" value="' + esc(S.heroine) + '" placeholder="Как её звали"></label>' +
      '<label class="lbl">Ваше имя (можно пропустить)<input id="rsPlayer" maxlength="20" value="' + esc(S.player) + '"></label>' +
      '<label class="lbl">С какого дня вы играли (номер дня от 1 до ' + last + ')<input id="rsDay" type="number" inputmode="numeric" min="1" max="' + last + '" value="1"></label>' +
      '<p class="muted small">Сегодня день ' + DAY + '. Дни с выбранного по ' + last + '-й отметятся выполненными, сегодняшний останется за вами.</p>' +
      '<div class="row"><button class="btn gold" data-act="restoreDo">Восстановить</button><button class="btn ghost" data-act="close">Отмена</button></div>');
  }
  function doRestore() {
    var last = Math.min(DAY - 1, TOTAL_DAYS);
    var sd = parseInt(document.getElementById('rsDay').value, 10);
    if (isNaN(sd) || sd < 1 || sd > last) { toast('Номер дня должен быть от 1 до ' + last); return; }
    var ns = defaults();
    ns.player = document.getElementById('rsPlayer').value.trim();
    ns.heroine = document.getElementById('rsHero').value.trim() || 'Мира';
    ns.started = true; ns.joinDay = sd; ns.restored = true;
    SPHERES.forEach(function (sp, i) { if (unlockDay(i) <= Math.min(DAY, TOTAL_DAYS)) ns.chosenDay[sp.id] = 0; });
    for (var d = sd; d <= last; d++) {
      ns.checks[d] = {};
      SPHERES.forEach(function (sp, i) { if (unlockDay(i) <= d) ns.checks[d][sp.id] = 1; });
    }
    S = ns; save(); closeModal(true); tab = 'today'; render();
    toast('Прогресс восстановлен. Выберите привычки заново');
    setTimeout(ensureChoices, 100);
  }

  /* ---------- картинки через canvas ---------- */
  function wrapText(ctx, text, maxW) {
    var words = text.split(' '), lines = [], line = '';
    words.forEach(function (w) { var t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; });
    if (line) lines.push(line); return lines;
  }
  function makeWallpaper(kind, quote) {
    try {
      var c = document.createElement('canvas'); c.width = 1080; c.height = 1920; var x = c.getContext('2d'); if (!x) return null;
      var pal = { listopad: ['#f6b25a', '#b8431f', '#fff'], sneg: ['#cfe0f0', '#5f86ad', '#16324a'], prazdnik: ['#16213e', '#4a2438', '#fff'], belaya: ['#fff4d6', '#f1b98a', '#4a1224'] }[kind] || ['#17402f', '#0f2a22', '#fff'];
      var g = x.createLinearGradient(0, 0, 0, 1920); g.addColorStop(0, pal[0]); g.addColorStop(1, pal[1]); x.fillStyle = g; x.fillRect(0, 0, 1080, 1920);
      var seed = 7; function r() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
      for (var i = 0; i < 70; i++) {
        var px = r() * 1080, py = r() * 1920;
        if (kind === 'listopad') { x.save(); x.translate(px, py); x.rotate(r() * 6); x.fillStyle = ['#c2562b', '#e08a2b', '#e9b72f', '#a63c1c'][i % 4]; x.beginPath(); x.ellipse(0, 0, 26 + r() * 20, 12 + r() * 8, 0, 0, 6.3); x.fill(); x.restore(); }
        else if (kind === 'sneg') { x.fillStyle = 'rgba(255,255,255,' + (0.4 + r() * 0.5) + ')'; x.beginPath(); x.arc(px, py, 3 + r() * 9, 0, 6.3); x.fill(); }
        else if (kind === 'prazdnik') { x.fillStyle = ['#e9b72f', '#d9628c', '#3f9b94', '#fff'][i % 4]; x.globalAlpha = 0.25 + r() * 0.6; x.beginPath(); x.arc(px, py, 4 + r() * 16, 0, 6.3); x.fill(); x.globalAlpha = 1; }
        else { x.fillStyle = 'rgba(255,255,255,' + (0.2 + r() * 0.4) + ')'; x.beginPath(); x.arc(px, py, 5 + r() * 12, 0, 6.3); x.fill(); }
      }
      x.fillStyle = pal[2]; x.textAlign = 'center'; x.shadowColor = 'rgba(0,0,0,.28)'; x.shadowBlur = 14; x.font = 'bold 88px "Playfair Display", Georgia, serif';
      var lines = wrapText(x, quote, 800), y = 800 - (lines.length - 1) * 60;
      lines.forEach(function (l, k) { x.fillText(l, 540, y + k * 118); }); x.shadowBlur = 0; x.shadowColor = 'transparent';
      x.font = '40px "Nunito", Arial, sans-serif'; x.globalAlpha = 0.8; x.fillText('Сезон привычек', 540, 1800); x.globalAlpha = 1;
      // силуэт кота
      x.fillStyle = pal[2]; x.globalAlpha = 0.9; x.beginPath(); x.ellipse(540, 1560, 70, 90, 0, 0, 6.3); x.fill(); x.beginPath(); x.arc(540, 1440, 56, 0, 6.3); x.fill();
      x.beginPath(); x.moveTo(494, 1410); x.lineTo(498, 1346); x.lineTo(534, 1392); x.fill(); x.beginPath(); x.moveTo(586, 1410); x.lineTo(582, 1346); x.lineTo(546, 1392); x.fill(); x.globalAlpha = 1;
      return c.toDataURL('image/png');
    } catch (e) { return null; }
  }
  function makeCertificate(st) {
    try {
      var c = document.createElement('canvas'); c.width = 1080; c.height = 1350; var x = c.getContext('2d'); if (!x) return null;
      var g = x.createLinearGradient(0, 0, 0, 1350); g.addColorStop(0, '#17402f'); g.addColorStop(1, '#0f2a22'); x.fillStyle = g; x.fillRect(0, 0, 1080, 1350);
      x.strokeStyle = '#e9b72f'; x.lineWidth = 8; x.strokeRect(40, 40, 1000, 1270); x.lineWidth = 2; x.strokeRect(62, 62, 956, 1226);
      x.textAlign = 'center'; x.fillStyle = '#e9b72f'; x.font = '44px "Nunito", Arial, sans-serif'; x.fillText('СЕРТИФИКАТ', 540, 170);
      x.fillStyle = '#f7efdc'; x.font = 'bold 92px "Playfair Display", Georgia, serif'; x.fillText('Сезон привычек', 540, 290); x.fillText('пройден', 540, 390);
      x.font = '46px "Nunito", Arial, sans-serif'; x.fillStyle = '#e9b72f';
      var who = S.player ? S.player : 'Вы'; x.fillText(who + ' и ' + hero(), 540, 500);
      x.fillStyle = '#f7efdc'; x.font = '38px "Nunito", Arial, sans-serif';
      var rows = ['90 дней: ' + dateStr(1) + ' - ' + dateStr(90), 'Дней с отметкой: ' + st.days, 'Лучшая серия: ' + st.best, 'Полных дней: ' + st.full, 'Находок в сундучке: ' + S.prizes.length, 'Значков: ' + BADGES.filter(function (b) { return badgeState(st)[b.id]; }).length + ' из ' + BADGES.length];
      rows.forEach(function (t, i) { x.fillText(t, 540, 600 + i * 62); });
      x.fillStyle = '#e9b72f'; x.font = 'italic 40px "Playfair Display", Georgia, serif'; x.fillText('Привычка - это когда уже не вспоминаешь,', 540, 1090); x.fillText('как было иначе.', 540, 1145);
      x.fillStyle = '#f7efdc'; x.font = '30px "Nunito", Arial, sans-serif'; x.fillText('Игру сделала Надежда Базарова. Хотите такую же?', 540, 1195); x.fillText('Напишите слово ИГРА', 540, 1233); x.fillText('Telegram: @NadezhdaBazarova · ВК: vk.ru/chansy', 540, 1271);
      return c.toDataURL('image/png');
    } catch (e) { return null; }
  }
  function showFinale() {
    var st = derive(), url = makeCertificate(st);
    showModal('<div class="finale"><h2>🎉 Сезон пройден!</h2><div class="fscene">' + sceneSVG({ items: st.items, season: 'belaya', holiday: false, final: true, acc: S.acc }) + '</div>' +
      '<p class="big">' + esc(hero()) + ' и ' + CAT + ' прошли все 90 дней. ' + st.days + ' дней с отметкой, лучшая серия ' + st.best + ', полных дней ' + st.full + '.</p>' +
      (url ? '<img class="cert" src="' + url + '" alt="Сертификат"><a class="btn gold" download="sertifikat-sezon-privychek.png" href="' + url + '">Скачать сертификат</a>' : '') + adHTML() + '</div>');
  }

  /* ---------- события ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]'); if (!t) return;
    var a = t.getAttribute('data-act');
    if (a === 'modalback') { if (e.target === t && modalDismiss) closeModal(); return; }
    if (a === 'tab') { tab = t.getAttribute('data-tab'); render(); window.scrollTo(0, 0); return; }
    if (a === 'check') { toggleCheck(t.getAttribute('data-id')); return; }
    if (a === 'quest') { toggleQuest(); return; }
    if (a === 'shield') { useShield(+t.getAttribute('data-day')); return; }
    if (a === 'noshield') { S.dismissShield[t.getAttribute('data-day')] = 1; save(); render(); return; }
    if (a === 'change') { openChooser(t.getAttribute('data-id')); return; }
    if (a === 'pick') { var sp = SPHERES.filter(function (s) { return s.id === t.getAttribute('data-id'); })[0]; var i = +t.getAttribute('data-i'); var inp = document.getElementById('ownHabit'); if (inp && sp) inp.value = sp.sugg[i]; Array.prototype.forEach.call(document.querySelectorAll('.chips2 .chip'), function (c) { c.classList.remove('on'); }); t.classList.add('on'); return; }
    if (a === 'confirmHabit') { confirmHabit(t.getAttribute('data-id')); return; }
    if (a === 'later') { S.skip[t.getAttribute('data-id')] = DAY; save(); closeModal(true); render(); return; }
    if (a === 'close') { closeModal(); return; }
    if (a === 'openchest') { openChest(); return; }
    if (a === 'wall') { var p = PRIZES.filter(function (x) { return x.id === t.getAttribute('data-id'); })[0]; var url = makeWallpaper(p.kind, p.quote); showModal('<h2>' + esc(p.title) + '</h2>' + (url ? '<img class="wallimg" src="' + url + '" alt="Обои"><a class="btn gold" download="sezon-privychek-' + p.kind + '.png" href="' + url + '">Скачать обои</a>' : '<p class="muted">В этом браузере обои создать не получилось.</p>')); return; }
    if (a === 'equip') { var id = t.getAttribute('data-id'); S.acc = S.acc === id ? null : id; save(); render(); return; }
    if (a === 'finale') { showFinale(); return; }
    if (a === 'welcomeNext') { showNames(); return; }
    if (a === 'setHero') { document.getElementById('nmHero').value = t.getAttribute('data-n'); return; }
    if (a === 'heroMyName') { var pn = document.getElementById('nmPlayer').value.trim(); if (pn) document.getElementById('nmHero').value = pn; else toast('Сначала напишите своё имя выше'); return; }
    if (a === 'namesDone') { namesDone(); return; }
    if (a === 'saveNames') { S.heroine = document.getElementById('setHero').value.trim() || 'Мира'; S.player = document.getElementById('setPlayer').value.trim(); save(); render(); toast('Сохранено'); return; }
    if (a === 'restoreOpen') { showRestore(); return; }
    if (a === 'restoreDo') { doRestore(); return; }
    if (a === 'reset') { if (window.confirm('Начать игру заново? Весь прогресс будет удалён.')) { try { localStorage.removeItem(KEY); } catch (e2) { } location.href = location.pathname; } return; }
  });
  document.addEventListener('click', function (e) {
    var b = e.target.closest('.badge'); if (b) toast(b.getAttribute('title'));
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && modalOpen && modalDismiss) closeModal(); });
  setInterval(function () { var d = calcToday(); if (d !== DAY && !params.has('day')) { DAY = d; render(); ensureChoices(); } }, 60000);

  /* ---------- запуск ---------- */
  render();
  if (!S.started) showWelcome(); else { afterChange(); ensureChoices(); }
  window.__sezon = { get state() { return S; }, derive: derive, day: function () { return DAY; } };
})();

</script>
